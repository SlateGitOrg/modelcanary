[project]
name = "modelcanary"
version = "0.1.0"
description = "Progressive model-delivery router: shadow and canary rollouts gated by SPRT and always-valid confidence sequences."
readme = "README.md"
license = "MIT"
authors = [{ name = "modelcanary contributors" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2",
    "onnxruntime>=1.31.0",
    "pydantic>=2",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
demo = [
    "httpx2>=2.16.0",
    "scikit-learn>=1.9.1",
    "skl2onnx>=1.20.0",
]

[project.scripts]
modelcanary = "modelcanary.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.9",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT", "C4", "RET", "ARG"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ARG001", "N802", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "sklearn.*", "skl2onnx.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error", "ignore::DeprecationWarning:skl2onnx.*", "ignore::DeprecationWarning:onnx.*"]

[tool.coverage.run]
source = ["modelcanary"]
branch = true
omit = ["*/modelcanary/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
